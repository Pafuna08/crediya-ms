server:
  port: 8080
spring:
  application:
    name: "crediya-autenticacacion-ms"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  datasource:
    # Base de datos en archivo (carpeta ./data) para que los registros sobrevivan a reinicios.
    # TODO: reemplazar por la base de datos definitiva (ej. PostgreSQL) cuando esté disponible
    url: "jdbc:h2:file:./data/crediya;AUTO_SERVER=TRUE"
    username: "sa"
    password: ""
    driverClassName: "org.h2.Driver"
  jpa:
    databasePlatform: "org.hibernate.dialect.H2Dialect"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
