server:
  # Autenticación usa el 8080; solicitudes corre en el 8081 para poder levantar ambos a la vez
  port: 8081
spring:
  application:
    name: "crediya-solicitudes-ms"
  devtools:
    add-properties: false
  profiles:
    include: null
  datasource:
    # PostgreSQL local (contenedor Docker postgres_local), base propia del microservicio.
    # Se pueden sobrescribir con variables de entorno.
    url: "${DB_URL:jdbc:postgresql://localhost:5432/solicitudes_db}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:postgres}"
    driverClassName: "org.postgresql.Driver"
  jpa:
    databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080,http://localhost:8081"
security:
  jwt:
    # DEBE ser la misma clave que usa el microservicio de autenticación para firmar los tokens.
    # El valor por defecto es SOLO para desarrollo: en otros ambientes definir JWT_SECRET (mínimo 32 caracteres).
    secret: "${JWT_SECRET:crediya-clave-secreta-solo-para-desarrollo-local}"
